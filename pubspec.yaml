name: netfree_yemen
description: "NetFree Yemen - تطبيق تشخيص الشبكة وإعدادات APN لمستخدمي يمن موبايل"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  connectivity_plus: ^6.0.0
  http: ^1.2.0
  internet_connection_checker_plus: ^2.5.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  android_intent_plus: ^5.0.2
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
